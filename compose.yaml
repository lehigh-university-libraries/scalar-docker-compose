services:
  db-backup:
    image: ghcr.io/lehigh-university-libraries/mysql-backup:main@sha256:502843d8772842bb3170a052222f091e6f5413cf1e920c81130e1ac61512368b
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${SCALAR_DB_HOSTNAME:-}
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: ${SCALAR_DB_USERNAME:-}
      DB_NAME: ${SCALAR_DB_DATABASE:-}
      BACKUP_CRON: "0 2 * * *" # UTC; 7 daily copies and 12 completed months.
    secrets:
      - source: SCALAR_DB_PASSWORD
        target: DB_PASSWORD
    volumes:
      - ./backups:/db

  scalar:
    image: ghcr.io/lehigh-university-libraries/scalar:2.6.12-php84@sha256:a7c6c486f8fc62a28d440630d059712a5ce40a9f5a6cdb35ed7a63926219eba5
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_PM: ondemand
      PHP_PM_MAX_CHILDREN: 10
      SCALAR_PHP_ERROR_REPORTING: ${SCALAR_PHP_ERROR_REPORTING:-4437}
      SCALAR_DB_HOSTNAME: ${SCALAR_DB_HOSTNAME:-}
      SCALAR_DB_USERNAME: ${SCALAR_DB_USERNAME:-}
      SCALAR_DB_DATABASE: ${SCALAR_DB_DATABASE:-}
      SCALAR_USE_LDAP: ${SCALAR_USE_LDAP:-}
      SCALAR_LDAP_SERVER: ${SCALAR_LDAP_SERVER:-}
      SCALAR_LDAP_PORT: ${SCALAR_LDAP_PORT:-}
      SCALAR_LDAP_BASEDN: ${SCALAR_LDAP_BASEDN:-}
      SCALAR_LDAP_EMAIL_DOMAIN: ${SCALAR_LDAP_EMAIL_DOMAIN:-}
      SCALAR_LDAP_OBJECT_CLASS: ${SCALAR_LDAP_OBJECT_CLASS:-}
      SCALAR_LOGIN_PENALTY_SECONDS: ${SCALAR_LOGIN_PENALTY_SECONDS:-}
      SCALAR_MAX_LOGIN_ATTEMPTS: ${SCALAR_MAX_LOGIN_ATTEMPTS:-}
    secrets:
      - SCALAR_DB_PASSWORD
      - SCALAR_SHASALT
      - SCALAR_ENCRYPTION_KEY
      - SCALAR_GOOGLE_MAPS_KEY
      - SCALAR_RECAPTCHA2_SITE_KEY
      - SCALAR_RECAPTCHA2_SECRET_KEY
    volumes:
      - type: bind
        source: ${SCALAR_DATA_DIR:?Set SCALAR_DATA_DIR to a separate books-only directory}
        target: /opt/scalar
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/status | grep -q pool"]
      start_period: 15s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:v3.7.19@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    restart: unless-stopped
    command:
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.priority=1
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --experimental.localplugins.captcha-protect.modulename=github.com/libops/captcha-protect
      - --accesslog=false
    environment:
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Set TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./conf/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./conf/traefik/challenge.tmpl.html:/etc/traefik/challenge.tmpl.html:ro
      - ./conf/traefik/plugins/captcha-protect:/plugins-local/src/github.com/libops/captcha-protect:ro
      - traefik-state:/data
    secrets:
      - CERT_PUBLIC_KEY
      - CERT_PRIVATE_KEY
    depends_on:
      scalar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      start_period: 15s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  default:
    ipam:
      config:
        - subnet: ${SCALAR_NETWORK_SUBNET:-172.18.0.0/16}

volumes:
  traefik-state: {}

secrets:
  CERT_PUBLIC_KEY:
    file: ./certs/cert.pem
  CERT_PRIVATE_KEY:
    file: ./certs/privkey.pem
  SCALAR_DB_PASSWORD:
    file: ./secrets/SCALAR_DB_PASSWORD
  SCALAR_SHASALT:
    file: ./secrets/SCALAR_SHASALT
  SCALAR_ENCRYPTION_KEY:
    file: ./secrets/SCALAR_ENCRYPTION_KEY
  SCALAR_GOOGLE_MAPS_KEY:
    file: ./secrets/SCALAR_GOOGLE_MAPS_KEY
  SCALAR_RECAPTCHA2_SITE_KEY:
    file: ./secrets/SCALAR_RECAPTCHA2_SITE_KEY
  SCALAR_RECAPTCHA2_SECRET_KEY:
    file: ./secrets/SCALAR_RECAPTCHA2_SECRET_KEY
